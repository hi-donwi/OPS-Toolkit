apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "opskit.fullname" . }}
  labels:
    {{- include "opskit.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "opskit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opskit.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.metrics.port }}"
        prometheus.io/path: "{{ .Values.metrics.path }}"
    spec:
      serviceAccountName: {{ default (include "opskit.fullname" .) .Values.serviceAccount.name }}
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/opskit
            - export-metrics
            - --port={{ .Values.metrics.port }}
            - --interval={{ .Values.metrics.interval }}
          env:
            # Inside the container, /proc describes the container. Point the
            # host rules at the node's procfs, bind-mounted below.
            - name: OPSKIT_PROC_ROOT
              value: /host/proc
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: etc-os
              mountPath: /etc/os-release
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: etc-os
          hostPath:
            path: /etc/os-release
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
