apiVersion: v1
kind: Namespace
metadata:
  name: opskit-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opskit-agent
  namespace: opskit-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opskit-viewer
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "nodes", "services", "endpoints", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opskit-viewer-binding
subjects:
  - kind: ServiceAccount
    name: opskit-agent
    namespace: opskit-system
roleRef:
  kind: ClusterRole
  name: opskit-viewer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: opskit-monitor
  namespace: opskit-system
  labels:
    app.kubernetes.io/name: opskit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: opskit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opskit
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9876"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: opskit-agent
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: opskit
          image: ghcr.io/donwi/opskit:latest
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/opskit
            - export-metrics
            - --port=9876
            - --interval=30s
          env:
            # Inside the container, /proc describes the container. Point the
            # host rules at the node's procfs, bind-mounted below.
            - name: OPSKIT_PROC_ROOT
              value: /host/proc
          ports:
            - containerPort: 9876
              name: metrics
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: etc-os
              mountPath: /etc/os-release
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: etc-os
          hostPath:
            path: /etc/os-release
