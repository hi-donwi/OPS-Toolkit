name: 'opskit SRE Verification Action'
description: 'OPS Toolkit automated pre-flight and post-deployment SRE health and security quality gate'
author: 'Doni Wicaksono'
branding:
  icon: 'activity'
  color: 'purple'

inputs:
  version:
    description: 'opskit version to download'
    required: false
    default: 'latest'
  command:
    description: 'opskit subcommand to run (verify, diag, audit)'
    required: false
    default: 'verify'
  fail-on:
    description: 'Threshold severity to trigger failure: critical or warning'
    required: false
    default: 'critical'
  namespace:
    description: 'Kubernetes namespace filter'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Download and Install opskit
      shell: bash
      env:
        OPSKIT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        curl -fsSL https://raw.githubusercontent.com/hi-donwi/OPS-Toolkit/main/install.sh -o /tmp/opskit-install.sh
        OPSKIT_VERSION="$OPSKIT_VERSION" bash /tmp/opskit-install.sh

    - name: Execute opskit Quality Gate
      shell: bash
      env:
        # Inputs are passed through the environment rather than interpolated
        # into the command line: `${{ }}` expansion happens before the shell
        # runs, so a value containing shell metacharacters would execute.
        OPSKIT_COMMAND: ${{ inputs.command }}
        OPSKIT_FAIL_ON: ${{ inputs.fail-on }}
        OPSKIT_NAMESPACE: ${{ inputs.namespace }}
      run: |
        set -euo pipefail

        args=()
        if [ -n "$OPSKIT_NAMESPACE" ]; then
          args+=(-n "$OPSKIT_NAMESPACE")
        fi

        if [ "$OPSKIT_COMMAND" = "verify" ]; then
          opskit verify --fail-on "$OPSKIT_FAIL_ON" "${args[@]}"
        else
          opskit "$OPSKIT_COMMAND" "${args[@]}"
        fi
